  /api/v1/integrations/grafana/alerts:
    x-mvp-status: mvp
    x-owner: event-hunter
    post:
      tags: [Grafana Alert Intake]
      operationId: receiveGrafanaAlertWebhook
      summary: 接收需要業務調查的 Grafana Alert Webhook
      description: |
        接收 Grafana 預設 webhook payload。伺服器必須先驗證 raw body 的 HMAC-SHA256：
        `hex(HMAC(secret, timestamp + ":" + rawBody))`，並拒絕與伺服器時間相差超過 300 秒的 timestamp。

        每個 alert 個別處理。只有 `status=firing`，且 labels 同時包含
        `event_hunter=investigate`、非空 `correlation_id` 與 `HIGH`／`CRITICAL` severity 時，
        才能建立或連結 Investigation Case。`resolved` 只新增 Evidence 與 receipt，絕不自動結案。
        firing alert 會連結 correlation_id 完全相同且尚未 CLOSED 的最新案件；沒有時以
        `Grafana: {alertname} [{correlation_id}]` 建立 OPEN 案件。resolved alert 只連結同一
        orgId、fingerprint 與 correlation_id 的既有 firing receipt；沒有相符案件時記為 IGNORED。

        dedup key 是下列陣列經 RFC 8785 JCS canonicalization 後的 SHA-256：
        `[orgId, receiver, groupKey, fingerprint, status, startsAt, endsAt]`。重送相同 alert 仍回傳 202，
        disposition 為 `DUPLICATE`，不可再次建立案件。
      security:
        - grafanaHmac: []
      parameters:
        - name: X-Grafana-Alerting-Timestamp
          in: header
          required: true
          description: Grafana HMAC 設定加入簽章的 Unix timestamp（秒）。
          schema:
            type: string
            pattern: '^[0-9]{10}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/integrations/grafana-alert-webhook.schema.json'
      responses:
        '202':
          description: Payload 已驗證；每個 alert 的建立、連結、忽略或重複結果列於回應。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrafanaAlertIntakeResult'
        '401':
          description: 缺少簽章、簽章不符、timestamp 過期或 timestamp 位於未來。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

