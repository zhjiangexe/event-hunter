        event_id:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        trace_id:
          type: [string, 'null']
    BusinessJourneyAnomaly:
      type: object
      required: [code, severity, message, event_ids]
      properties:
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        message:
          type: string
        event_ids:
          type: array
          items:
            type: string
    EventSearchResponse:
      type: object
      required: [events, count, truncated]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalEvent'
        count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
    PatternFinding:
      type: object
      additionalProperties: false
      required: [pattern_id, matched_conditions, severity, evidence_references, recommended_next_query]
      properties:
        finding_id:
          type: string
          format: uuid
          description: 已持久化 finding 的識別碼；同步分析中的暫時結果可能尚未提供。
        pattern_id:
          type: string
          example: payment-completed-without-shipment
        matched_conditions:
          type: array
          items:
            type: string
          example: [PAYMENT_COMPLETED_EXISTS, SHIPMENT_CREATED_MISSING_WITHIN_5M]
        severity:
          $ref: '#/components/schemas/Severity'
        evidence_references:
          type: array
          items:
            type: string
          example: [evt-001, evt-002, trace-500]
        recommended_next_query:
          type: string
          example: 查詢 shipping.events 是否在付款成功後建立 Shipment。
        query_template_id:
          type: string
          example: events.by_correlation.v1
        replay_conditions:
          type: array
          items:
            type: string
          description: 未來 Projection Rebuild／Sandbox Replay 可驗證的條件；MVP 只保存，不執行。
        feedback:
          $ref: '#/components/schemas/PatternFindingFeedback'
    ClassifyPatternFindingRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, FALSE_POSITIVE, NEEDS_REVIEW]
    PatternFindingFeedback:
      type: object
      additionalProperties: false
      required: [finding_id, status, actor_id, actor_role, updated_at, lock_version]
      properties:
        finding_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UNREVIEWED, CONFIRMED, FALSE_POSITIVE, NEEDS_REVIEW]
        actor_id:
          type: string
          description: UNREVIEWED 時為空字串。
        actor_role:
          type: string
          description: UNREVIEWED 時為空字串。
        updated_at:
          type: [string, 'null']
          format: date-time
        lock_version:
          type: integer
          format: int64
          minimum: 0
    ClassifyCheckFindingRequest:
      $ref: '#/components/schemas/ClassifyPatternFindingRequest'
    CheckFindingFeedback:
      $ref: '#/components/schemas/PatternFindingFeedback'
    Evidence:
      type: object
      additionalProperties: false
      required: [id, evidence_type, reference, source, open_action, collected_at]
      properties:
        id:
          type: string
          format: uuid
        evidence_type:
          type: string
          enum: [EVENT, TRACE, LOG, METRIC, GRAFANA_ALERT, QUALITY_VIOLATION, PATTERN_FINDING, REPORT]
        reference:
          type: string
          description: 指向 ClickHouse、Trace、Log 或案件內部資料的穩定參照，不直接內嵌完整 PII。
        source:
          type: string
          enum: [CLICKHOUSE, TEMPO, LOKI, GRAFANA, PATTERN_ENGINE, REPORT_STORE, UNKNOWN]
          description: reference 的權威來源；Event Hunter 只保存參照與完整性資訊。
        open_action:
          type: string
          enum: [GRAFANA_EVENT, GRAFANA_TEMPO, GRAFANA_LOKI, GRAFANA_DASHBOARD, GRAFANA_ALERT, PATTERN_LIBRARY, NONE]
          description: 前端可依受信任 URL builder 執行的來源操作，不接受任意外部 URL。
        source_locator:
          type: string
          pattern: '^/alerting/(grafana/)?[A-Za-z0-9_-]+/(view|edit)$'
          description: 經後端驗證的相對來源路徑；不得包含 origin、credentials 或任意外部 URL。
        source_org_id:
          type: integer
          minimum: 1
          description: 來源 Grafana organization ID；只與受信任的 relative source_locator 組合。
        collected_at:
          type: string
          format: date-time
        checksum:
          type: [string, 'null']
          description: 證據內容雜湊，用於確認報告產生後資料未被替換。
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, actor_id, actor_role, action, request_id, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
        actor_role:
          $ref: '#/components/schemas/DemoRole'
        action:
          type: string
          enum: [CREATE_INVESTIGATION, UPDATE_INVESTIGATION, ADD_INVESTIGATION_NOTE, ATTACH_INVESTIGATION_EVENT, ANALYZE_INVESTIGATION, CLOSE_INVESTIGATION]
        request_id:
          type: string
        trace_id:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
          description: 僅保存操作摘要，不得保存完整敏感 payload。
        created_at:
          type: string
          format: date-time
    EvidenceBundleManifest:
      type: object
      additionalProperties: false
      required: [schema_version, investigation_id, generated_at, query_window, partial, warnings, source_status, items, checksum_algorithm, manifest_sha256]
      properties:
        schema_version:
          type: integer
          const: 1
        investigation_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        query_window:
          $ref: '#/components/schemas/QueryWindow'
        partial:
          type: boolean
          description: 任一 Evidence item 缺少必要完整性資訊時為 true。
        warnings:
          type: array
          items:
            type: string
        source_status:
          $ref: '#/components/schemas/EvidenceSourceStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        checksum_algorithm:
          type: string
          const: SHA-256
        manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 排除本欄位後，依 RFC 8785 JCS canonicalization 產生 bytes，再計算 SHA-256。
    QueryWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    SourceStatus:
      type: string
      enum: [OK, PARTIAL, UNAVAILABLE, TIMEOUT, NOT_REQUESTED]
    EvidenceSourceStatus:
      type: object
      additionalProperties: false
      required: [postgres, clickhouse, technical_observability]
      properties:
        postgres:
          $ref: '#/components/schemas/SourceStatus'
        clickhouse:
          $ref: '#/components/schemas/SourceStatus'
        technical_observability:
          $ref: '#/components/schemas/SourceStatus'
    InvestigationSummary:
      type: object
      required: [investigation_id, generated_at, query_window, event_retention_boundary, partial, warnings, source_status, source_last_success_at, case, timeline, pattern_findings, evidence_references, audit_entries]
      properties:
        investigation_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        query_window:
          $ref: '#/components/schemas/QueryWindow'
        event_retention_boundary:
          type: string
          format: date-time
          description: 依目前 90 天 canonical event TTL 推導的近似保留邊界；早於此時間的原始事件可能已被非同步清理。
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        source_status:
          type: object
          required: [postgres, clickhouse, technical_observability]
          properties:
            postgres:
              $ref: '#/components/schemas/SourceStatus'
            clickhouse:
              $ref: '#/components/schemas/SourceStatus'
            technical_observability:
              $ref: '#/components/schemas/SourceStatus'
        source_last_success_at:
          type: object
          additionalProperties: false
          required: [postgres, clickhouse, technical_observability]
          properties:
            postgres:
              type: [string, 'null']
              format: date-time
            clickhouse:
              type: [string, 'null']
              format: date-time
            technical_observability:
              type: [string, 'null']
              format: date-time
        case:
          $ref: '#/components/schemas/InvestigationCase'
        timeline:
          $ref: '#/components/schemas/BusinessTimeline'
        quality:
          type: object
          additionalProperties: true
        pattern_findings:
          type: array
          items:
            $ref: '#/components/schemas/PatternFinding'
        technical_observations:
          type: object
          additionalProperties: true
          description: 摘要與 deep links，不內嵌完整 Logs／Traces。
        evidence_references:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        audit_entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
    InvestigationCase:
      type: object
      required: [id, case_no, title, severity, status, allowed_transitions, correlation_id, incident_from, incident_to, incident_window_source, priority, tags, related_correlation_ids, last_updated_by, sla_status, sla_due_at, collaboration_notes, evidence, pattern_findings, lock_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        case_no:
          type: string
          example: INC-2026-0001
        title:
          type: string
          example: 訂單付款成功但未建立出貨單
        severity:
          $ref: '#/components/schemas/Severity'
        status:
          $ref: '#/components/schemas/InvestigationStatus'
        allowed_transitions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/InvestigationStatus'
          description: |
            目前案件可執行的目標狀態，由 aggregate 產生。`CLOSED` 表示可呼叫專用
            closeInvestigation operation；不得以 updateInvestigation 直接設為 CLOSED。
        correlation_id:
          type: string
          example: ORDER-1001
        incident_from:
          type: string
          format: date-time
          description: 案件建立時保存的不可變基準窗口起點。
        incident_to:
          type: string
          format: date-time
          description: 案件建立時保存的不可變基準窗口終點；與 incident_from 的距離最多七天。
        incident_window_source:
          type: string
          enum: [TIMELINE_SEARCH, MANUAL_DEFAULT, GRAFANA_ALERT, LEGACY_CREATED_AT]
          description: 基準窗口的可追溯推導來源。
        assignee:
          type: [string, 'null']
          description: Phase 1.1 的 owner；沿用 assignee 欄位名稱避免重複責任欄位。
          example: oncall-payments
        priority:
          $ref: '#/components/schemas/CasePriority'
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        related_correlation_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        last_updated_by:
          type: string
        sla_status:
          $ref: '#/components/schemas/CaseSLAStatus'
        sla_due_at:
          type: string
          format: date-time
        root_cause:
          type: [string, 'null']
        resolution_summary:
          type: [string, 'null']
        fixed_version:
          type: [string, 'null']
        notes:
          type: [string, 'null']
          readOnly: true
          deprecated: true
          description: Phase 1 舊資料的唯讀相容欄位；新筆記一律使用 collaboration_notes。
        collaboration_notes:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationNote'
        workflow_id:
          type: [string, 'null']
          description: Temporal Workflow ID；不保存 Temporal Server 內部資料作為本平台資料表。
        pattern_findings:
          type: array
          items:
            $ref: '#/components/schemas/PatternFinding'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        lock_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [title, severity, correlation_id]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        severity:
          $ref: '#/components/schemas/Severity'
        correlation_id:
          type: string
          minLength: 1
        incident_from:
          type: string
          format: date-time
          description: 選填；與 incident_to 必須同時提供。Timeline 建案應保存目前查詢窗口。
        incident_to:
          type: string
          format: date-time
          description: 選填；與 incident_from 必須同時提供，且窗口不得超過七天。
        start_workflow:
          type: boolean
          default: false
          description: 是否同時啟動選用的 Temporal Case Workflow；伺服器未啟用時拒絕此選項。
    AnalyzeInvestigationRequest:
      type: object
      additionalProperties: false
      properties:
        pattern_ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: 未提供時執行所有已註冊且適用的 Pattern。
        execution_mode:
          type: string
          enum: [SYNC, TEMPORAL]
          default: SYNC
    AnalysisResult:
      type: object
      required: [investigation_id, execution_mode, analyzed_at, analysis_status, executed_pattern_ids, effective_window, findings]
      properties:
        investigation_id:
          type: string
          format: uuid
        execution_mode:
          type: string
          const: SYNC
        analyzed_at:
          type: string
          format: date-time
        analysis_status:
          type: string
          enum: [EVALUATED, NO_EVENTS]
          description: |
            `NO_EVENTS` 明確表示 correlation 沒有 canonical event，不等同 Pattern no-match。
        executed_pattern_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: 本次實際評估的 immutable Registry Pattern IDs；即使沒有 finding 也必須回傳。
        effective_window:
          oneOf:
            - $ref: '#/components/schemas/EffectiveAnalysisWindow'
            - type: 'null'
          description: |
            `NO_EVENTS` 時為 null；其餘由伺服器依 event time 決定。
        findings:
          type: array
          items:
            $ref: '#/components/schemas/PatternFinding'
    EffectiveAnalysisWindow:
      type: object
      additionalProperties: false
      required: [from, to, observed_at, anchor, source_event_count]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: Exclusive upper bound；固定為最早 correlation event 後七天。
        observed_at:
          type: string
          format: date-time
          description: Pattern maturity 判定時間；超過固定 window 後會封頂，不再隨 wall clock 漂移。
        anchor:
          type: string
          const: EARLIEST_CORRELATION_EVENT
        source_event_count:
          type: integer
          minimum: 1
    UpdateInvestigationRequest:
      type: object
      minProperties: 1
      description: |
        一般案件更新。若將狀態改為 `RESOLVED`，必須同時提供 `root_cause` 與
        `resolution_summary`；不得用本 operation 設成 `CLOSED`，結案必須呼叫
        `closeInvestigation`。狀態轉移以 investigation-state-machine.yaml 為準。
      allOf:
        - if:
            properties:
              status:
                const: RESOLVED
            required: [status]
          then:
            required: [root_cause, resolution_summary]
            properties:
              root_cause:
                type: string
                minLength: 1
              resolution_summary:
                type: string
                minLength: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum: [INVESTIGATING, WAITING_APPROVAL, RESOLVED]
          description: "`OPEN` 是初始狀態，`CLOSED` 只能由 closeInvestigation 設定。"
        severity:
          $ref: '#/components/schemas/Severity'
        assignee:
          type: [string, 'null']
          maxLength: 200
          description: Phase 1.1 owner；空字串或 null 會清除 owner。
        priority:
          $ref: '#/components/schemas/CasePriority'
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
        related_correlation_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        root_cause:
          type: [string, 'null']
        resolution_summary:
          type: [string, 'null']
        fixed_version:
          type: [string, 'null']
          description: 已部署的修正版；不代表本 API 自動部署。
    CasePriority:
      type: string
      enum: [P0, P1, P2, P3]
      description: P0/P1/P2/P3 的目標處理時間分別為 1/4/24/72 小時。
    CaseSLAStatus:
      type: string
      enum: [ON_TRACK, DUE_SOON, BREACHED, COMPLETED]
    InvestigationNote:
      type: object
      additionalProperties: false
      required: [id, body, author_id, author_role, created_at]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 2000
        author_id:
          type: string
        author_role:
          $ref: '#/components/schemas/DemoRole'
        created_at:
          type: string
          format: date-time
    AddInvestigationNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    AddInvestigationNoteResponse:
      type: object
      additionalProperties: false
      required: [investigation, note]
      properties:
        investigation:
          $ref: '#/components/schemas/InvestigationCase'
        note:
          $ref: '#/components/schemas/InvestigationNote'
    AttachInvestigationEventRequest:
      type: object
      additionalProperties: false
      required: [event_id, from, to]
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 200
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
          description: 必須晚於 from，且查詢時間窗不得超過七天。
    AttachInvestigationEventResponse:
      type: object
      additionalProperties: false
      required: [investigation, evidence, attached]
      properties:
        investigation:
          $ref: '#/components/schemas/InvestigationCase'
        evidence:
          $ref: '#/components/schemas/Evidence'
        attached:
          type: boolean
          description: true 表示本次新增 reference；false 表示相同 evidence 已存在。
    CloseInvestigationRequest:
      type: object
      required: [root_cause, resolution_summary]
      properties:
        root_cause:
          type: string
          minLength: 1
        resolution_summary:
          type: string
          minLength: 1
        fixed_version:
          type: [string, 'null']
          description: 已部署的修正版；不代表本 API 自動部署。
    WorkflowAccepted:
      type: object
      required: [case_id, workflow_id, status]
      properties:
        case_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          example: investigation-case-INC-2026-0001
        status:
          type: string
          enum: [QUEUED, RUNNING]
        message:
          type: string
          example: Pattern 調查已排入 Temporal Workflow。
    ReplaySession:
      type: object
      required: [id, investigation_id, replay_type, status, source_correlation_id, lock_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        investigation_id:
          type: string
          format: uuid
        replay_type:
          $ref: '#/components/schemas/ReplayType'
        status:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
        source_correlation_id:
          type: string
        target_service_version:
          type: [string, 'null']
          description: 隔離環境使用的服務版本。
        sandbox_id:
          type: [string, 'null']
        workflow_id:
          type: [string, 'null']
        comparison_summary:
          type: [object, 'null']
          additionalProperties: true
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        lock_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateReplayRequest:
      type: object
      required: [investigation_id, replay_type, source_correlation_id]
      properties:
        investigation_id:
          type: string
          format: uuid
        replay_type:
          $ref: '#/components/schemas/ReplayType'
        source_correlation_id:
          type: string
        target_service_version:
          type: [string, 'null']
        requested_invariants:
          type: array
          items:
            type: string
          example: [capturedAmount <= authorizedAmount, activeShipmentCount <= 1]
        dry_run:
          type: boolean
          default: true
          description: 是否只產生比較計畫；第一版應維持 true。
    ApproveReplayRequest:
      type: object
      required: [approval_reason, sandbox_id]
      properties:
        approval_reason:
          type: string
          minLength: 1
        sandbox_id:
          type: string
          description: 已建立且不連接正式服務的隔離環境識別碼。
        expires_at:
          type: string
          format: date-time
          description: 核准有效期限。
    EventDefinitionPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDefinition'
        pagination:
          $ref: '#/components/schemas/Pagination'
    TopicPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopicRegistration'
        pagination:
          $ref: '#/components/schemas/Pagination'
    QualityViolationPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualityViolation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    InvestigationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationCase'
        next_cursor:
          type: [string, 'null']
          description: 下一頁游標；沒有下一頁時為 null。

security:
  - demoSession: []
  - bearerAuth: []
