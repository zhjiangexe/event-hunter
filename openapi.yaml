    patch:
      tags: [Investigation]
      operationId: classifyPatternFinding
      summary: 記錄 Pattern finding 的人工判定
      description: |
        不修改 append-only finding；只更新獨立的人工判定 current state。必須以 finding feedback
        的 `lock_version` 傳入 `If-Match`，更新與 `CLASSIFY_PATTERN_FINDING` audit 在同一個
        PostgreSQL transaction 內完成。`UNREVIEWED` 是尚未判定的虛擬初始狀態，不能寫入。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyPatternFindingRequest'
      responses:
