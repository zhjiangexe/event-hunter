  /api/v1/investigations/{investigationId}/evidence/events:
    x-mvp-status: phase-1.1
    x-owner: event-hunter
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    post:
      tags: [Investigation]
      operationId: attachInvestigationEvent
      summary: 將 Timeline event 加入案件
      description: |
        以 bounded `from`/`to` 到 ClickHouse 精確驗證 event 後，只將 EVENT reference 與
        checksum 附加到案件，不複製 event payload。同一案件重複附加同一 event 為
        idempotent no-op；新 evidence、related correlation 與 lock_version 在同一個
        PostgreSQL transaction 內完成。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachInvestigationEventRequest'
      responses:
        '200':
          description: Event 已附加，或相同 reference 先前已存在。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachInvestigationEventResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/investigations/{investigationId}/analyze:
    x-mvp-status: mvp
    x-owner: event-hunter
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    post:
      tags: [Investigation]
      operationId: analyzeInvestigation
      summary: 執行 Pattern 調查
      description: |
        預設同步執行 immutable Registry 中所有 ACTIVE Pattern；只有進階操作明確提供
        `pattern_ids` 時才限制執行集合。伺服器會以 correlation 的最早 canonical event
        建立最多七天且可重現的 event-time window；沒有事件時明確回傳 `NO_EVENTS`，事件跨度
        超過上限時回傳 `ANALYSIS_WINDOW_EXCEEDS_LIMIT`，不會以 wall-clock rolling window
        產生誤導性的 no-match。只有要求 `TEMPORAL` 且伺服器已啟用 Temporal 時，才排入低頻 Workflow。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeInvestigationRequest'
      responses:
        '200':
          description: 同步 Pattern 分析完成。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '202':
          description: 選用的調查工作已排入 Temporal。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 案件狀態不允許分析，或要求 Temporal 但功能未啟用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Pattern ID 不存在、未啟用或不屬於 immutable Registry。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyTimeout'

  /api/v1/investigations/{investigationId}/findings/{findingId}/feedback:
    x-mvp-status: phase-1.1
    x-owner: event-hunter
    parameters:
