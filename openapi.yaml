      properties:
        topic_name:
          type: string
          example: payment.events
        partition_key:
          type: string
          example: aggregateId
        ordering_guarantee:
          type: string
          enum: [PER_PARTITION, PER_AGGREGATE, NONE]
        retention_days:
          type: integer
          minimum: 1
        pii_classification:
          $ref: '#/components/schemas/PiiClassification'
        owner:
          type: string
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatus'
          default: ACTIVE
    UpdateTopicRequest:
      type: object
      minProperties: 1
      properties:
        partition_key:
          type: string
        ordering_guarantee:
          type: string
          enum: [PER_PARTITION, PER_AGGREGATE, NONE]
        retention_days:
          type: integer
          minimum: 1
        pii_classification:
          $ref: '#/components/schemas/PiiClassification'
        owner:
          type: string
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatus'
    QualitySummary:
      type: object
