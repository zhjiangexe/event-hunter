        event_count:
          type: integer
          format: int64
          minimum: 0
        duplicate_count:
          type: integer
          format: int64
          minimum: 0
        schema_violation_count:
          type: integer
          format: int64
          minimum: 0
        out_of_order_candidate_count:
          type: integer
          format: int64
          minimum: 0
        dlq_count:
          type: integer
          format: int64
          minimum: 0
        average_delay_ms:
          type: number
          format: double
          minimum: 0
    TopicQuality:
      type: object
      required: [topic_name, from, to, consumer_groups, totals]
      properties:
        topic_name:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        consumer_groups:
          type: array
          items:
            $ref: '#/components/schemas/ConsumerGroupQuality'
        totals:
          $ref: '#/components/schemas/QualityTotals'
    ConsumerGroupQuality:
      type: object
      required: [group_id, consumer_lag, last_seen_at]
      properties:
        group_id:
          type: string
        consumer_lag:
          type: integer
          format: int64
          minimum: 0
        last_seen_at:
          type: string
          format: date-time
    QualityViolation:
      type: object
      required: [id, violation_type, severity, detected_at, topic_name, evidence_event_ids]
      properties:
        id:
          type: string
          format: uuid
        violation_type:
          type: string
          example: DUPLICATE_EVENT
        severity:
          $ref: '#/components/schemas/Severity'
        detected_at:
          type: string
          format: date-time
        topic_name:
          type: string
        partition:
          type: [integer, 'null']
          minimum: 0
        evidence_event_ids:
          type: array
          items:
            type: string
        summary:
          type: string
          example: 同一 eventId 在兩個 offset 出現。
    CanonicalEvent:
      type: object
      required: [event_id, event_type, event_version, occurred_at, producer, correlation_id, trace_id, aggregate_type, aggregate_id, admission_status, quality_flags, admission_profile, ingested_at]
      properties:
        event_id:
          type: string
          example: evt-001
        event_type:
          type: string
          example: PaymentCompleted
        event_version:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
        producer:
          type: string
          example: payment-service
        correlation_id:
          type: string
          example: ORDER-1001
        causation_id:
          type: [string, 'null']
          example: evt-000
        trace_id:
          type: [string, 'null']
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        aggregate_type:
          type: string
          example: Payment
        aggregate_id:
          type: string
          example: PAYMENT-1001
        sequence:
          type: [integer, 'null']
          minimum: 0
          example: 7
        kafka_topic:
          type: [string, 'null']
          example: payment.events
        kafka_partition:
          type: [integer, 'null']
          minimum: 0
        kafka_offset:
          type: [integer, 'null']
          format: int64
          minimum: 0
        payload:
          type: [object, 'null']
          description: 只有在授權且要求 `include_payload=true` 時回傳遮罩後內容。
          additionalProperties: true
        ingested_at:
          type: string
          format: date-time
        trace_url:
          type: [string, 'null']
          format: uri
        service_version:
          type: [string, 'null']
        admission_status:
          type: string
          enum: [SEARCHABLE, SEARCHABLE_WITH_WARNINGS]
          description: 代表事件是否足以可靠搜尋；不等同完整業務 payload contract 已驗證。
        quality_flags:
          type: array
          description: 非阻擋式 ingestion 品質警告；空陣列代表目前 profile 沒有 warning。
          items:
            type: string
            enum: [UNKNOWN_EVENT_TYPE, UNKNOWN_EVENT_VERSION, INVALID_TRACE_ID, AGGREGATE_TYPE_MISMATCH]
        admission_profile:
          type: string
          description: 產生 admission_status 與 quality_flags 的驗證 profile。
        processing_summary:
          type: [object, 'null']
          description: Consumer 處理重試摘要；只有來源提供 processing-attempt 遙測時才會回傳。
          properties:
            attempt_count:
              type: integer
              minimum: 1
              example: 3
            final_status:
              type: string
              enum: [STARTED, FAILED, RETRY_SCHEDULED, SUCCEEDED, DLQ]
              example: SUCCEEDED
            consumer_groups:
              type: array
              items:
                type: string
              example: [inventory-service]
            retry_reasons:
              type: array
              items:
                type: string
              example: [DB_TIMEOUT]
            last_attempt_at:
              type: [string, 'null']
              format: date-time
    BusinessTimeline:
      type: object
      required: [correlation_id, from, to, event_count, events]
      properties:
        correlation_id:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        event_count:
          type: integer
          format: int64
          minimum: 0
        truncated:
          type: boolean
          description: 是否因 limit 而截斷結果。
        events:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalEvent'
    BusinessJourney:
      type: object
      required: [correlation_id, profile_id, profile_version, profile_title, from, to, status, event_count, completed_milestone_count, total_milestone_count, current_milestone_id, next_milestone_id, next_expected_event_types, trace_ids, milestones, anomalies, unmapped_event_count]
      properties:
        correlation_id:
          type: string
        profile_id:
          type: string
          description: 此次解讀採用的 Git-managed Journey Profile 穩定識別碼。
        profile_version:
          type: integer
          minimum: 1
        profile_title:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        status:
          type: string
          enum: [EMPTY, IN_PROGRESS, COMPLETED, FAILED, COMPENSATED]
        event_count:
          type: integer
          minimum: 0
        completed_milestone_count:
          type: integer
          minimum: 0
          description: 目前狀態為 COMPLETED 的里程碑數；失敗與補償不計入。
        total_milestone_count:
          type: integer
          minimum: 0
        current_milestone_id:
          type: [string, 'null']
          description: 第一個進行中里程碑；失敗或補償時則為造成終止狀態的里程碑。
        next_milestone_id:
          type: [string, 'null']
          description: Profile 排序中目前里程碑的下一個定義；可能是選用支線，不代表一定會發生。
        next_expected_event_types:
          type: array
          description: 目前里程碑正在等待或可接受的事件類型。
          items:
            type: string
        trace_ids:
          type: array
          description: 此查詢窗口內 canonical events 所帶的相異 trace ID，依事件時間首次出現排序。
          items:
            type: string
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/BusinessJourneyMilestone'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/BusinessJourneyAnomaly'
        unmapped_event_count:
          type: integer
          minimum: 0
          description: 未落在目前物流 milestone 定義內的事件數；事件仍保留在 canonical store。
    JourneyProfilePage:
