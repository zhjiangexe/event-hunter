        未指定前綴的 opaque identifier 必須由使用者選擇候選，不得直接猜測查詢。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartSearchRequest'
      responses:
        '200':
          description: 辨識、候選或失敗結果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmartSearchResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/saved-searches:
    x-mvp-status: phase-1.1
    x-owner: event-hunter
    get:
      tags: [Event Check]
      operationId: listSavedSearches
      summary: 列出目前 principal 的個人 Saved Searches
      description: 只回傳 session subject 自己保存的查詢；不提供角色共享或全域搜尋。
      responses:
        '200':
          description: 個人 Saved Search 清單。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearchList'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      tags: [Event Check]
      operationId: createSavedSearch
      summary: 保存目前 bounded query state
      description: |
        保存 allowlisted Event Check query shortcut。ABSOLUTE 固定事件鑑識時間窗；
        RELATIVE 在每次列出時依目前時間重建最近 1 小時／24 小時／72 小時／7 天等窗口。
        窗口最多七天，且不接受 include_payload、任意 SQL、任意 path 或外部 URL。資料庫內既有
        Timeline／Journey target 由 compatibility mapper 轉成 bounded Event Check state。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavedSearchRequest'
      responses:
        '201':
          description: Saved Search 已建立。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        '409':
          description: 同一 principal 已有相同名稱。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/saved-searches/{savedSearchId}:
    x-mvp-status: phase-1.1
    x-owner: event-hunter
    parameters:
      - name: savedSearchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Event Check]
      operationId: deleteSavedSearch
      summary: 刪除目前 principal 自己的 Saved Search
      responses:
        '204':
          description: 已刪除。
        '404':
