openapi: 3.1.0
info:
  title: Event Hunter API
  version: 0.1.0
  summary: 業務事件鑑識、流程符合性檢查與案件協作 API
  description: |
    Event Hunter 是建立在 Kafka、ClickHouse 與 OpenTelemetry 資料之上的
    業務級事件鑑識平台。Phase 1.1 的 canonical 產品入口是 Event Check、Saved Results、
    Check Models、Investigation Cases、Ingestion Issues 與 Scenario Lab。Event Check 以有界
    canonical events 和 immutable Check Model 產生 deterministic result；只有明確保存或案件交接
    才建立 Check Snapshot。

    舊 Business Timeline、Business Journey、Journey Profile 與 Pattern endpoints 目前只作 bounded
    compatibility adapter，已標記 deprecated；它們不是新的 authoring 或產品決策來源。個人 Saved Search
    API 則保留，作為 Event Check 的 typed Query Shortcuts。

    本文件也保留完整的未來 API 草案。Event Catalog、Topic Registry、Event Hunter 自建 Runtime
    Quality UI 與 Replay 是延後功能，先由 Schema Registry／Kafka tooling／Grafana OSS 等既有元件處理。
    Grafana OSS 負責 Logs／Metrics／Traces、Dashboard、Explore、Correlations 與
    Alerting；Event Hunter 只接收需要業務調查的 Grafana Alert Webhook，並保存參照。

    ### 重要邊界

    - Check Models 與 legacy Pattern Engine 只做確定性唯讀調查，不直接修改正式業務資料。
    - `forensics_events` 等事件資料位於 ClickHouse；案件、權限與設定位於 PostgreSQL。
    - Temporal 是預設關閉的選用能力，只負責低頻、可重試、可能等待人工核准的案件流程；MVP 核心功能不依賴 Temporal。
    - Kafka Consumer 的事件重試由 Consumer Framework／Retry Topic／DLQ 處理；Event Hunter 只有在來源提供 attempt 與錯誤資訊時才呈現重試摘要。
    - Production Redrive（把歷史事件重新送回正式事件流）不在本 API 草案範圍內。
  contact:
    name: Event Hunter Team
  license:
    name: Proprietary / Internal Draft
servers:
  - url: http://localhost:28333
    description: 本機開發環境
  - url: https://event-hunter.example.com
    description: 預留的部署環境（尚未實作）
x-event-hunter-api-protection:
  appliesToPathPrefix: /api/
  rateLimitPolicy: contracts/platform/failure-policy.yaml#/rate_limits/api_by_remote_address
  timeoutPolicy: contracts/platform/failure-policy.yaml#/timeouts/http_request_total
  description: 所有 `/api/` 回應都可能依平台保護政策回傳 429；依賴來源逾時的查詢回傳 504。
tags:
  - name: Demo Auth
    description: MVP 示範用角色 Session；不建立帳號、密碼或使用者資料表，正式環境改接外部 OIDC。
    x-mvp-status: mvp
  - name: Event Catalog
    description: 【暫先不做】管理事件類型、Producer、Consumer 與 Schema 版本；MVP 使用既有 Schema Registry。
    x-mvp-status: deferred
  - name: Topic Registry
    description: 【暫先不做】管理 Kafka Topic 的治理設定與訂閱關係；MVP 使用 Kafka／Redpanda tooling。
    x-mvp-status: deferred
  - name: Runtime Quality
    description: 【暫先不做 Event Hunter API】事件延遲、重複、Schema 違規、亂序候選與 Consumer lag 由 ClickHouse + Grafana 處理。
    x-mvp-status: deferred-for-event-hunter
  - name: Grafana Alert Intake
    description: 接收經 HMAC 驗證、具 correlationId 的選定 Grafana 業務告警；不取代 Grafana Alerting。
    x-mvp-status: mvp
  - name: Business Timeline
    description: Deprecated compatibility API；canonical Timeline 位於 Event Check workspace。
    x-mvp-status: deprecated-compatibility
  - name: Ingestion Issues
    description: 統一查詢 Schema 驗證、Admission quarantine 與 technical DLQ 的安全摘要；不回傳 raw payload 或 exception 細節。
    x-mvp-status: phase-1.1
  - name: Event Check
    description: 由任一受支援 ID 建立有界 scope 並執行唯讀流程符合性檢查；一般 evaluation 不保存。
    x-mvp-status: canonical-phase-1.1
  - name: Check Models
    description: 列出 YAML／Git 發布並編譯進 immutable Registry 的 Flow Models 與 Global Checks，並可按需讀取 checksum 驗證的原始 YAML。
    x-mvp-status: canonical-phase-1.1
  - name: Journey Profile Registry
    description: Deprecated compatibility API；canonical authoring source 已移至 Check Models。
    x-mvp-status: deprecated-compatibility
  - name: Investigation
    description: 建立、分析、指派、更新與結案的業務調查案件。
    x-mvp-status: mvp
  - name: Pattern Registry
    description: Deprecated compatibility API；canonical deterministic rules 已移至 Check Models。
    x-mvp-status: deprecated-compatibility
  - name: Replay
    description: 【Phase 2／3】Projection Rebuild 與 Sandbox Behavioral Replay 的受控流程，MVP 不提供。
    x-mvp-status: phase-2-3
paths:
  /api/v1/auth/demo-session:
    x-mvp-status: mvp
    x-owner: event-hunter
    post:
      tags: [Demo Auth]
      operationId: createDemoSession
      summary: 選擇示範角色並建立 Session
      description: 只供本機與作品展示使用；伺服器簽署 HttpOnly Cookie，不建立使用者資料。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      responses:
        '200':
          description: Session 建立成功。
          headers:
            Set-Cookie:
              description: 簽署的 `eh_demo_session` HttpOnly Cookie。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPrincipal'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Demo Auth]
      operationId: deleteDemoSession
      summary: 清除目前示範 Session
      responses:
        '204':
          description: Session 已清除。
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/me:
    x-mvp-status: mvp
    x-owner: event-hunter
    get:
      tags: [Demo Auth]
      operationId: getCurrentPrincipal
      summary: 取得目前角色與權限
      responses:
        '200':
          description: 目前 Session 的角色與有效權限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPrincipal'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/event-checks/evaluations:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    post:
      tags: [Event Check]
      operationId: evaluateEventCheck
      summary: 即時解析事件範圍並執行 Check Model
      description: >-
        Stateless query-time evaluation。NO_DATA、IDENTIFIER_SELECTION_REQUIRED、
        MODEL_SELECTION_REQUIRED 與 NO_APPLICABLE_MODEL 都以 200 回傳可操作的產品狀態；
        本 operation 不建立 PostgreSQL Snapshot，也不接受 SQL、任意 URL 或 production command。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/event-check/event-check-evaluation.schema.json#/$defs/EvaluationRequest'
      responses:
        '200':
          description: 事件範圍解析完成；可能已評估、需要選擇或沒有資料／Model。
          content:
            application/json:
              schema:
                $ref: './contracts/event-check/event-check-evaluation.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyTimeout'

  /api/v1/check-models:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    get:
      tags: [Check Models]
      operationId: listCheckModels
      summary: 列出 immutable Check Model Registry
      description: 回傳已發布 Flow Models 與 Global Checks；本階段不提供 runtime CRUD 或發布 API。
      responses:
        '200':
          description: Check Model catalog。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './contracts/check-models/check-model-registry.schema.json#/$defs/RegistryEntry'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/check-models/{modelId}/versions/{version}:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    get:
      tags: [Check Models]
      operationId: getCheckModelVersion
      summary: 取得指定 Check Model immutable version
      parameters:
        - $ref: '#/components/parameters/CheckModelId'
        - $ref: '#/components/parameters/CheckModelVersion'
      responses:
        '200':
          description: Model definition、source path 與 checksum 由 server response metadata 一併提供。
          content:
            application/json:
              schema:
                $ref: './contracts/check-models/check-model-registry.schema.json#/$defs/RegistryEntry'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/check-models/{modelId}/versions/{version}/source:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    get:
      tags: [Check Models]
      operationId: getCheckModelSource
      summary: 取得指定 Check Model version 的原始 YAML
      description: >-
        回傳 build-time 嵌入且通過 SHA-256 驗證的原始 YAML；不接受任意檔案路徑，亦不在 runtime
        讀取 workspace filesystem。
      parameters:
        - $ref: '#/components/parameters/CheckModelId'
        - $ref: '#/components/parameters/CheckModelVersion'
      responses:
        '200':
          description: 原始 YAML、repository-relative source path 與 checksum。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckModelSourceDocument'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/check-snapshots:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    get:
      tags: [Event Check]
      operationId: listCheckSnapshots
      summary: 列出已保存的 immutable Event Check 結果
      description: >-
        Saved Results read-model。以建立時間與 UUID 進行穩定 keyset 分頁，可依識別碼或
        Check status 篩選；僅回傳摘要、固定 evaluation request 與案件連結數，不包含 event payload。
      parameters:
        - name: identifier
          in: query
          description: 依保存時的 identifier value 搜尋，最多 200 字元。
          schema:
            type: string
            maxLength: 200
        - name: check_status
          in: query
          schema:
            type: string
            enum: [NO_DATA, IN_PROGRESS, CONFORMANT, DEVIATED, INCONCLUSIVE, AMBIGUOUS]
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: 上一頁回應的 `next_cursor`，第一次查詢不傳。
          schema:
            type: string
      responses:
        '200':
          description: Saved Results page。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckSnapshotPage'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      tags: [Event Check]
      operationId: createCheckSnapshot
      summary: 驗證 evaluation hashes 並保存 immutable Snapshot
      description: >-
        只允許 INVESTIGATOR／ADMIN。伺服器使用相同 as_of 與 pinned Model version 重算；
        event set 或 result 改變時回 409 EVALUATION_CHANGED，不接受前端 result JSON 作為正式資料。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './contracts/event-check/check-snapshot.schema.json#/$defs/CreateCheckSnapshotRequest'
      responses:
        '200':
          description: 相同 actor 與 Idempotency-Key 已成功，回傳原 Snapshot。
          content:
            application/json:
              schema:
                $ref: './contracts/event-check/check-snapshot.schema.json'
        '201':
          description: Snapshot、event refs、relations、findings 與 Audit 已 transactionally 建立。
          content:
            application/json:
              schema:
                $ref: './contracts/event-check/check-snapshot.schema.json'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            `EVALUATION_CHANGED`、`MODEL_VERSION_UNAVAILABLE` 或 `IDEMPOTENCY_KEY_REUSED`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCheckConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '504':
          $ref: '#/components/responses/DependencyTimeout'

  /api/v1/check-snapshots/{snapshotId}:
    x-mvp-status: canonical-phase-1.1
    x-owner: event-check
    get:
      tags: [Event Check]
      operationId: getCheckSnapshot
      summary: 取得 immutable Check Snapshot
      parameters:
        - $ref: '#/components/parameters/CheckSnapshotId'
      responses:
        '200':
          description: >-
            Snapshot 與保存當下的 event reference 可用狀態。ClickHouse TTL／Evidence Archive 的讀取時
            source revalidation 由選用的 EH-ECM-007 交付。
          content:
            application/json:
              schema:
                $ref: './contracts/event-check/check-snapshot.schema.json'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/check-findings/{findingId}/feedback:
    x-mvp-status: canonical-phase-1.1
    x-owner: investigation
    parameters:
      - $ref: '#/components/parameters/CheckFindingId'
    patch:
      tags: [Investigation, Event Check]
      operationId: classifyCheckFinding
      summary: 更新 generalized Check Finding 的人工判定
      description: >-
        Finding 本身 append-only；只更新 feedback current state。相容期舊 classifyPatternFinding
        透過 adapter 操作同一筆 feedback，不建立第二套狀態。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyCheckFindingRequest'
      responses:
        '200':
          description: Feedback 與 Audit 已在同一 transaction 更新。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckFindingFeedback'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/investigations/{investigationId}/check-snapshots:
    x-mvp-status: canonical-phase-1.1
    x-owner: investigation
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    get:
      tags: [Investigation, Event Check]
      operationId: listInvestigationCheckSnapshots
      summary: 列出案件已連結的 Check Snapshots
      responses:
        '200':
          description: 依 linked_at 排序的 immutable Snapshot links。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvestigationCheckSnapshotLink'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Investigation, Event Check]
      operationId: attachInvestigationCheckSnapshot
      summary: 以 optimistic lock 將 Snapshot 加入案件
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachInvestigationCheckSnapshotRequest'
      responses:
        '200':
          description: Snapshot 已連結，回傳既有 link；不重複寫入 Audit 或推進 Case lock version。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationCheckSnapshotLink'
        '201':
          description: Link 與 Audit 已建立，Case lock version 已推進。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationCheckSnapshotLink'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/patterns:
    x-mvp-status: deprecated-compatibility
    x-owner: event-hunter
    get:
      tags: [Pattern Registry]
      operationId: listPatterns
      deprecated: true
      summary: 列出可執行的確定性 Pattern
      description: 相容 endpoint；正式判定來源已遷移至 Check Model Registry，待 compatibility acceptance 後移除。
      responses:
        '200':
          description: Pattern 清單。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatternDefinition'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/patterns/effectiveness:
    x-mvp-status: deprecated-compatibility
    x-owner: event-hunter
    get:
      tags: [Pattern Registry]
      operationId: getPatternEffectiveness
      deprecated: true
      summary: 取得 Pattern 成效摘要
      description: >-
        由後端在固定 30 天窗口彙總 PostgreSQL pattern findings；資料來源失敗時回傳 503，
        不以零值偽裝成沒有命中。Pattern definition 仍由 Git-managed YAML registry 提供。
      responses:
        '200':
          description: 已啟用 Pattern 的成效摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternEffectivenessSummary'
        '401':
          description: 尚未建立有效 Session。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/events:
    x-mvp-status: deferred
    x-owner: schema-registry
    get:
      tags: [Event Catalog]
      operationId: listEventDefinitions
      summary: 列出事件定義
      description: 查詢平台已登錄的事件類型。這不是從 ClickHouse 查詢原始事件，而是查詢 PostgreSQL 控制面中的事件目錄。
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - name: producer
          in: query
          description: 只回傳指定 Producer 的事件定義。
          schema:
            type: string
        - name: lifecycle_status
          in: query
          description: 事件生命週期狀態。
          schema:
            $ref: '#/components/schemas/LifecycleStatus'
      responses:
        '200':
          description: 事件定義清單。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Event Catalog]
      operationId: createEventDefinition
      summary: 建立事件定義
      description: 建立一個事件類型的治理資料。事件本身仍由業務服務透過 Outbox 與 Kafka 發布。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventDefinitionRequest'
      responses:
        '201':
          description: 建立成功。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
        '409':
          description: 同一事件類型已存在，或版本衝突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/events/{eventType}:
    x-mvp-status: deferred
    x-owner: schema-registry
    parameters:
