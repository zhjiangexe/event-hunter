components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: eh_demo_session
      description: MVP 示範用的簽署 HttpOnly Cookie；不對應使用者資料表。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 正式環境預留，由外部 OIDC／Identity Provider 核發；MVP 使用 `demoSession`。
    grafanaHmac:
      type: apiKey
      in: header
      name: X-Grafana-Alerting-Signature
      description: |
        Grafana Webhook Contact Point 產生的 hex HMAC-SHA256。伺服器必須搭配
        `X-Grafana-Alerting-Timestamp` 與 raw request body 驗證，使用 constant-time comparison。
  parameters:
    EventType:
      name: eventType
      in: path
      required: true
      description: 事件類型，例如 `PaymentCompleted`。
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[A-Za-z][A-Za-z0-9._-]*$'
    TopicName:
      name: topicName
      in: path
      required: true
      description: Kafka Topic 名稱；特殊字元需 URL encode。
      schema:
        type: string
        minLength: 1
        maxLength: 249
    CorrelationId:
      name: correlationId
      in: path
      required: true
      description: 串起同一筆跨服務業務流程的 correlation ID。
      schema:
        type: string
        minLength: 1
        maxLength: 200
    InvestigationId:
      name: investigationId
      in: path
      required: true
      description: 調查案件 UUID。
      schema:
        type: string
        format: uuid
    CheckModelId:
      name: modelId
      in: path
      required: true
      description: Git-managed Check Model 穩定識別碼。
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{2,63}$'
    CheckModelVersion:
      name: version
      in: path
      required: true
      description: Immutable Check Model version；不接受 latest。
      schema:
        type: integer
        minimum: 1
    CheckSnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Immutable Check Snapshot UUID。
      schema:
        type: string
        format: uuid
    CheckFindingId:
      name: findingId
      in: path
      required: true
      description: Persisted generalized Check Finding UUID。
      schema:
        type: string
        format: uuid
    ReplayId:
      name: replayId
      in: path
      required: true
      description: Replay 工作 UUID。
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      description: 每頁筆數；伺服器仍會套用最大上限。
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageCursor:
      name: page_cursor
      in: query
      description: 上一頁回應的 `next_cursor`，第一次查詢不傳。
      schema:
        type: string
    FromTime:
      name: from
      in: query
      required: true
      description: 查詢起始時間（含）。所有分析查詢必須明確限定時間範圍。
      schema:
        type: string
        format: date-time
    ToTime:
      name: to
      in: query
      required: true
      description: 查詢結束時間（不含）。
      schema:
        type: string
        format: date-time
    FromTimeOptional:
      name: from
      in: query
      description: 選填的查詢起始時間；未提供時由伺服器使用安全預設範圍。
      schema:
        type: string
        format: date-time
    ToTimeOptional:
      name: to
      in: query
      description: 選填的查詢結束時間。
      schema:
        type: string
        format: date-time
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: GET 回應的 ETag，例如 `W/"investigation-123-lock-v7"`。版本不符時回傳 `409 Conflict`。
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Actor-scoped Snapshot create retry key；相同 key 搭配不同 request 回 409。
      schema:
        type: string
        minLength: 8
        maxLength: 200
  headers:
    ETag:
      description: 資源版本，用於下一次更新的 `If-Match` 樂觀鎖。
      schema:
        type: string
        example: W/"investigation-123-lock-v7"
    RateLimitLimit:
      description: 目前固定窗口允許的最大請求數。
      schema:
        type: integer
    RateLimitRemaining:
      description: 目前固定窗口剩餘的請求數。
      schema:
        type: integer
    RateLimitReset:
      description: 距離目前窗口重設的秒數。
      schema:
        type: integer
    RetryAfter:
      description: 被限流後可重試前應等待的秒數。
      schema:
        type: integer
  responses:
    BadRequest:
      description: 請求格式或查詢條件錯誤。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request Schema 驗證失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    NotFound:
      description: 找不到指定資源。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 目前角色缺少執行此操作所需的權限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 樂觀鎖版本衝突或目前狀態不允許此操作。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    RateLimited:
      description: 同一遠端位址在固定窗口內超過 API 請求上限。
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DependencyUnavailable:
      description: 必要的 PostgreSQL 或 ClickHouse 來源無法使用。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DependencyTimeout:
      description: 必要來源超過伺服器端查詢期限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CheckModelSourceDocument:
      type: object
      additionalProperties: false
      required: [model_id, version, source_path, checksum, yaml]
      properties:
        model_id:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,63}$'
        version:
          type: integer
          minimum: 1
        source_path:
          type: string
          pattern: '^contracts/check-models/[a-z0-9._/-]+\.yaml$'
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        yaml:
          type: string
          minLength: 1
          description: 與 checksum 對應的原始 UTF-8 YAML 內容。
    DemoRole:
      type: string
      enum: [VIEWER, INVESTIGATOR, ADMIN]
    DemoSessionRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/DemoRole'
    CurrentPrincipal:
      type: object
      additionalProperties: false
      required: [subject, role, permissions]
      properties:
        subject:
          type: string
          example: demo:investigator
        role:
          $ref: '#/components/schemas/DemoRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
          example: ['timeline:read', 'investigation:read', 'investigation:create', 'investigation:analyze']
    GrafanaAlertDisposition:
      type: string
      enum: [CREATED_CASE, LINKED_CASE, IGNORED, RECORDED_RESOLUTION, DUPLICATE]
    GrafanaAlertIntakeItem:
      type: object
      additionalProperties: false
      required: [fingerprint, status, disposition, receipt_id]
      properties:
        fingerprint:
          type: string
        status:
          type: string
          enum: [firing, resolved]
        disposition:
          $ref: '#/components/schemas/GrafanaAlertDisposition'
        receipt_id:
          type: string
          format: uuid
          description: 新 receipt 或重複通知已存在的 receipt ID。
        investigation_id:
          type: [string, 'null']
          format: uuid
        reason_code:
          type: [string, 'null']
          enum:
            - MISSING_CORRELATION_ID
            - INELIGIBLE_SEVERITY
            - NOT_MARKED_FOR_INVESTIGATION
            - RESOLUTION_RECORDED
            - NO_MATCHING_CASE
            - DUPLICATE_NOTIFICATION
            - null
    GrafanaAlertIntakeResult:
      type: object
      additionalProperties: false
      required: [received_alert_count, accepted_at, items]
      properties:
        received_alert_count:
          type: integer
          minimum: 1
        accepted_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/GrafanaAlertIntakeItem'
    PatternDefinition:
      type: object
      additionalProperties: false
      required: [id, version, name, condition, severity, window, required_event_types, expected_event_types, exclusion_event_types, evidence_query_template_id, status, mutable_at_runtime, source_path, checksum, fixture_coverage]
      properties:
        id:
          type: string
          example: payment-completed-without-shipment
        version:
          type: integer
          minimum: 1
        name:
          type: string
          example: Payment completed without shipment
        condition:
          type: string
          example: Detect a paid order that has no shipment within the fixed investigation window.
        severity:
          $ref: '#/components/schemas/Severity'
        window:
          type: string
          format: duration
          example: PT5M
        required_event_types:
          type: array
          items:
            type: string
        expected_event_types:
          type: array
          items:
            type: string
        exclusion_event_types:
          type: array
          items:
            type: string
        evidence_query_template_id:
          type: string
          example: events.by_correlation.v1
        status:
          type: string
          enum: [ACTIVE]
          description: MVP registry 只公開目前程式碼已啟用的不可變 Pattern。
        mutable_at_runtime:
          type: boolean
          const: false
        source_path:
          type: string
          description: Pattern 定義在版本控制中的專案相對路徑。
          example: contracts/patterns/payment-completed-without-shipment.yaml
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 原始 YAML bytes 的 SHA-256，可用於驗證部署中的定義版本。
        fixture_coverage:
          $ref: '#/components/schemas/PatternFixtureCoverage'
    PatternFixtureCoverage:
      type: object
      additionalProperties: false
      required: [match_count, non_match_count, total]
      properties:
        match_count:
          type: integer
          minimum: 0
        non_match_count:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    PatternEffectivenessSummary:
      type: object
      additionalProperties: false
      required: [generated_at, window, items]
      properties:
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/OverviewWindow'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatternEffectivenessMetric'
    PatternEffectivenessMetric:
      type: object
      additionalProperties: false
      required: [pattern_id, hit_count, last_hit_at, investigation_count, confirmed_count, false_positive_count, needs_review_count, unreviewed_count, reviewed_count, false_positive_rate]
      properties:
        pattern_id:
          type: string
        hit_count:
          type: integer
          format: int64
          minimum: 0
        last_hit_at:
          type: [string, 'null']
          format: date-time
        investigation_count:
          type: integer
          format: int64
          minimum: 0
        confirmed_count:
          type: integer
          format: int64
          minimum: 0
        false_positive_count:
          type: integer
          format: int64
          minimum: 0
        needs_review_count:
          type: integer
          format: int64
          minimum: 0
        unreviewed_count:
          type: integer
          format: int64
          minimum: 0
        reviewed_count:
          type: integer
          format: int64
          minimum: 0
        false_positive_rate:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: FALSE_POSITIVE / reviewed_count；沒有人工判定時為 null，不假裝為 0。
    LifecycleStatus:
      type: string
      enum: [DRAFT, ACTIVE, DEPRECATED]
      description: 事件或 Schema 的生命週期。
    PiiClassification:
      type: string
      enum: [NONE, INTERNAL, CONFIDENTIAL, RESTRICTED]
      description: 事件可能包含的個資或敏感資料分類。
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
      description: 案件或品質違規嚴重度。
    SourceState:
      type: string
      enum: [fresh, stale, partial, unavailable]
      description: 所有調查畫面共用的資料來源狀態。
    SourceHealth:
      type: object
      additionalProperties: false
      required: [name, state, last_success_at, lag_ms, reason]
      properties:
        name:
          type: string
          enum: [postgresql, clickhouse, tempo, loki, grafana]
        state:
          $ref: '#/components/schemas/SourceState'
        last_success_at:
          type: [string, 'null']
          format: date-time
        lag_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
        reason:
          type: [string, 'null']
    OverviewCountByKey:
      type: object
      additionalProperties: false
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
    OverviewCaseCounts:
      type: object
      additionalProperties: false
      required: [open, investigating, closed]
      properties:
        open: { type: integer, format: int64, minimum: 0 }
        investigating: { type: integer, format: int64, minimum: 0 }
        closed: { type: integer, format: int64, minimum: 0 }
    OverviewSeverityCounts:
      type: object
      additionalProperties: false
      required: [low, medium, high, critical]
      properties:
        low: { type: integer, format: int64, minimum: 0 }
        medium: { type: integer, format: int64, minimum: 0 }
        high: { type: integer, format: int64, minimum: 0 }
        critical: { type: integer, format: int64, minimum: 0 }
    OverviewRecentActivity:
      type: object
      additionalProperties: false
      required: [cases_created, cases_closed, grafana_alerts, scenario_passed, scenario_failed, scenario_timed_out]
      properties:
        cases_created: { type: integer, format: int64, minimum: 0 }
        cases_closed: { type: integer, format: int64, minimum: 0 }
        grafana_alerts: { type: integer, format: int64, minimum: 0 }
        scenario_passed: { type: integer, format: int64, minimum: 0 }
        scenario_failed: { type: integer, format: int64, minimum: 0 }
        scenario_timed_out: { type: integer, format: int64, minimum: 0 }
    OverviewControlPlane:
      type: object
      additionalProperties: false
      required: [cases, severity, activity, top_patterns]
      properties:
        cases:
          $ref: '#/components/schemas/OverviewCaseCounts'
        severity:
          $ref: '#/components/schemas/OverviewSeverityCounts'
        activity:
          $ref: '#/components/schemas/OverviewRecentActivity'
        top_patterns:
          type: array
          items:
            $ref: '#/components/schemas/OverviewCountByKey'
    OverviewEvents:
      type: object
      additionalProperties: false
      required: [event_count, latest_event_at, latest_processing_attempt_at, top_producers, top_event_types]
      properties:
        event_count:
          type: integer
          format: int64
          minimum: 0
        latest_event_at:
          type: [string, 'null']
          format: date-time
        latest_processing_attempt_at:
          type: [string, 'null']
          format: date-time
        top_producers:
          type: array
          items:
            $ref: '#/components/schemas/OverviewCountByKey'
        top_event_types:
          type: array
          items:
            $ref: '#/components/schemas/OverviewCountByKey'
    OverviewWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    InvestigationOverview:
      type: object
      additionalProperties: false
      required: [generated_at, window, partial, warnings, control_plane, events, sources]
      properties:
        generated_at:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/OverviewWindow'
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        control_plane:
          oneOf:
            - $ref: '#/components/schemas/OverviewControlPlane'
            - type: 'null'
        events:
          oneOf:
            - $ref: '#/components/schemas/OverviewEvents'
            - type: 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceHealth'
    SourceHealthResponse:
      type: object
      additionalProperties: false
      required: [generated_at, partial, warnings, sources]
      properties:
        generated_at:
          type: string
          format: date-time
        partial:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceHealth'
    SmartSearchRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          maxLength: 220
    SmartSearchStatus:
      type: string
      enum: [IDENTIFIED, AMBIGUOUS, INVALID]
    SmartSearchIdentifierType:
      type: string
      enum: [EVENT_ID, TRACE_ID, CORRELATION_ID, AGGREGATE_ID, ALERT_FINGERPRINT]
    SmartSearchCandidate:
      type: object
      additionalProperties: false
      required: [identifier_type, query_parameter, certainty, reason]
      properties:
        identifier_type:
          $ref: '#/components/schemas/SmartSearchIdentifierType'
        query_parameter:
          type: string
          enum: [event_id, trace_id, correlation_id, aggregate_id, alert_id]
        certainty:
          type: string
          enum: [EXACT, STRONG, CANDIDATE]
        reason:
          type: string
          enum: [EXPLICIT_PREFIX, W3C_TRACE_ID_FORMAT, GRAFANA_FINGERPRINT_FORMAT, OPAQUE_IDENTIFIER_FORMAT]
    SmartSearchResult:
      type: object
      additionalProperties: false
      required: [input, normalized_input, status, candidates, message]
      properties:
        input:
          type: string
        normalized_input:
          type: string
        status:
          $ref: '#/components/schemas/SmartSearchStatus'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SmartSearchCandidate'
        message:
          type: string
          enum: [EMPTY_INPUT, INPUT_TOO_SHORT, INPUT_TOO_LONG, INVALID_EXPLICIT_IDENTIFIER, UNSUPPORTED_IDENTIFIER_FORMAT, IDENTIFIER_CONFIRMED, SELECT_IDENTIFIER_TYPE]
    SavedSearchTarget:
      type: string
      enum: [EVENT_CHECK, TIMELINE, JOURNEY]
      description: EVENT_CHECK 是正式目標；TIMELINE 與 JOURNEY 僅供既有查詢捷徑相容。
    SavedSearchQuery:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        time_mode:
          type: string
          enum: [ABSOLUTE, RELATIVE]
          description: 未提供時視為 ABSOLUTE，以相容既有 Saved Search。
        relative_window_seconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: time_mode=RELATIVE 時必填；每次讀取時以目前 UTC 時間重建 from/to。
        from:
          type: string
          format: date-time
          description: ABSOLUTE 的固定起點；RELATIVE 時保存建立當下的參考快照。
        to:
          type: string
          format: date-time
          description: ABSOLUTE 的固定終點；RELATIVE 時保存建立當下的參考快照。
        correlation_id: { type: string, maxLength: 200 }
        event_type: { type: string, maxLength: 200 }
        aggregate_id: { type: string, maxLength: 200 }
        trace_id: { type: string, maxLength: 200 }
        event_id: { type: string, maxLength: 200 }
        producer: { type: string, maxLength: 200 }
        event_version: { type: integer, minimum: 1 }
        causation_id: { type: string, maxLength: 200 }
        kafka_topic: { type: string, maxLength: 200 }
        kafka_partition: { type: integer, minimum: 0 }
        kafka_offset: { type: integer, format: int64, minimum: 0 }
        pattern_id: { type: string, maxLength: 200 }
        alert_id: { type: string, maxLength: 200 }
        severity:
          $ref: '#/components/schemas/Severity'
        include_processing_attempts:
          type: boolean
          default: false
        identifier_type:
          type: string
          enum: [AUTO, CORRELATION_ID, EVENT_ID, TRACE_ID, AGGREGATE_ID, BUSINESS_KEY]
          description: target=EVENT_CHECK 時必填。
        identifier_value:
          type: string
          maxLength: 200
          description: target=EVENT_CHECK 時必填。
        aggregate_type:
          type: string
          maxLength: 200
        business_key_name:
          type: string
          maxLength: 200
        model_id:
          type: string
          maxLength: 200
        model_version:
          type: integer
          minimum: 1
        workspace_tab:
          type: string
          enum: [summary, timeline, flow, findings, cases]
          description: target=EVENT_CHECK 時預設為 summary。
    CreateSavedSearchRequest:
      type: object
      additionalProperties: false
      required: [name, target, query]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        target:
          $ref: '#/components/schemas/SavedSearchTarget'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
    SavedSearch:
      type: object
      additionalProperties: false
      required: [id, owner_subject, name, target, query, open_url, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_subject:
          type: string
        name:
          type: string
        target:
          $ref: '#/components/schemas/SavedSearchTarget'
        query:
          $ref: '#/components/schemas/SavedSearchQuery'
        open_url:
          type: string
          pattern: '^/(event-check|timeline|journey)\\?'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedSearchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SavedSearch'
    SearchPreset:
      type: object
      additionalProperties: false
      required: [id, name, description, open_url]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        open_url:
          type: string
          pattern: '^/timeline\\?'
    SearchPresetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchPreset'
    IngestionIssueKind:
      type: string
      enum: [CONTRACT_VALIDATION, ADMISSION_QUARANTINE, TECHNICAL_DLQ]
    IngestionIssue:
      type: object
      additionalProperties: false
      required: [id, kind, occurred_at, pipeline, error_code, event_id, event_type, correlation_id, source_topic, source_partition, source_offset, dlq_topic, dlq_partition, dlq_offset, payload_sha256, admission_profile, connector_name, connector_task, failure_stage, exception_class]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/IngestionIssueKind' }
        occurred_at: { type: string, format: date-time }
        pipeline: { type: string }
        error_code: { type: string }
        event_id: { type: [string, 'null'] }
        event_type: { type: [string, 'null'] }
        correlation_id: { type: [string, 'null'] }
        source_topic: { type: [string, 'null'] }
        source_partition: { type: [integer, 'null'], minimum: 0 }
        source_offset: { type: [integer, 'null'], format: int64, minimum: 0 }
        dlq_topic: { type: [string, 'null'] }
        dlq_partition: { type: [integer, 'null'], minimum: 0 }
        dlq_offset: { type: [integer, 'null'], format: int64, minimum: 0 }
        payload_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        admission_profile: { type: [string, 'null'] }
        connector_name: { type: [string, 'null'] }
        connector_task: { type: [integer, 'null'], minimum: 0 }
        failure_stage: { type: [string, 'null'] }
        exception_class: { type: [string, 'null'] }
    IngestionIssuePage:
      type: object
      additionalProperties: false
      required: [items, page_size, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionIssue'
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, 'null']
    InvestigationStatus:
      type: string
      enum: [OPEN, INVESTIGATING, WAITING_APPROVAL, RESOLVED, CLOSED]
      description: 調查案件狀態；狀態轉移需由伺服器依狀態機驗證。
    ReplayType:
      type: string
      enum: [PROJECTION_REBUILD, SANDBOX_BEHAVIORAL_REPLAY]
      description: 隔離分析類型，不包含 Production Redrive。
    Pagination:
      type: object
      required: [page_size]
      properties:
        page_size:
          type: integer
          minimum: 1
        next_cursor:
          type: [string, 'null']
          description: 下一頁游標；沒有下一頁時為 null。
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          description: 給使用者或工程師看的錯誤說明。
          example: 找不到指定的調查案件。
        request_id:
          type: string
          description: 供客服與日誌查找的請求 ID。
          example: req_01J5QZ7F9P
        details:
          type: object
          additionalProperties: true
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field_errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
    ConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [current_lock_version]
          properties:
            current_lock_version:
              type: integer
              format: int64
              description: 伺服器目前版本；客戶端應重新 GET 後再提交。
            current_resource:
              type: object
              additionalProperties: true
    EventCheckConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [EVALUATION_CHANGED, MODEL_VERSION_UNAVAILABLE, IDEMPOTENCY_KEY_REUSED]
            current_event_set_hash:
              type: [string, 'null']
              pattern: '^[0-9a-f]{64}$'
            current_evaluation_hash:
              type: [string, 'null']
              pattern: '^[0-9a-f]{64}$'
          description: >-
            EVALUATION_CHANGED 時回傳目前 hashes，要求使用者重新檢視；伺服器不得靜默保存不同結果。
    CheckSnapshotSummary:
      type: object
      additionalProperties: false
      required: [id, created_by, created_by_role, created_at, evaluation_request, as_of, source_health_status, model, check_status, event_count, finding_count, linked_case_count]
      properties:
        id:
          type: string
          format: uuid
        created_by:
          type: string
        created_by_role:
          type: string
          enum: [INVESTIGATOR, ADMIN]
        created_at:
          type: string
          format: date-time
        evaluation_request:
          $ref: './contracts/event-check/event-check-evaluation.schema.json#/$defs/EvaluationRequest'
        as_of:
          type: string
          format: date-time
        source_health_status:
          type: string
          enum: [HEALTHY, STALE, PARTIAL, UNAVAILABLE]
        model:
          type: object
          additionalProperties: false
          required: [id, version, kind]
          properties:
            id:
              type: string
            version:
              type: integer
              minimum: 1
            kind:
              type: string
              enum: [FLOW, GLOBAL_CHECK]
        check_status:
          type: string
          enum: [NO_DATA, IN_PROGRESS, CONFORMANT, DEVIATED, INCONCLUSIVE, AMBIGUOUS]
        event_count:
          type: integer
          minimum: 0
        finding_count:
          type: integer
          minimum: 0
        linked_case_count:
          type: integer
          minimum: 0
    CheckSnapshotPage:
      type: object
      additionalProperties: false
      required: [items, page_size, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CheckSnapshotSummary'
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type: [string, 'null']
    AttachInvestigationCheckSnapshotRequest:
      type: object
      additionalProperties: false
      required: [snapshot_id]
      properties:
        snapshot_id:
          type: string
          format: uuid
    InvestigationCheckSnapshotLink:
      type: object
      additionalProperties: false
      required: [investigation_id, snapshot_id, linked_by, linked_by_role, linked_at]
      properties:
        investigation_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        linked_by:
          type: string
          minLength: 1
          maxLength: 200
        linked_by_role:
          type: string
          enum: [INVESTIGATOR, ADMIN]
        linked_at:
          type: string
          format: date-time
    EventDefinition:
      type: object
      required: [event_type, description, producer, owner, compatibility_policy, lifecycle_status, lock_version, created_at, updated_at]
      properties:
        event_type:
          type: string
          example: PaymentCompleted
        description:
          type: string
          example: 付款成功後由 Payment Service 發出的業務事件。
        producer:
          type: string
          example: payment-service
        consumers:
          type: array
          items:
            type: string
          example: [order-service, analytics-sink]
        owner:
          type: string
          example: payments-platform
        compatibility_policy:
          type: string
          enum: [BACKWARD, FORWARD, FULL, NONE]
          description: Schema 演進的相容性政策。
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatus'
        current_schema_version:
          type: [integer, 'null']
          minimum: 1
        lock_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateEventDefinitionRequest:
      type: object
      required: [event_type, description, producer, owner, compatibility_policy]
      properties:
        event_type:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._-]*$'
          example: PaymentCompleted
        description:
          type: string
          minLength: 1
        producer:
          type: string
          example: payment-service
        consumers:
          type: array
          items:
            type: string
        owner:
          type: string
        compatibility_policy:
          type: string
          enum: [BACKWARD, FORWARD, FULL, NONE]
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatus'
          default: DRAFT
    EventSchemaVersion:
      type: object
      required: [event_type, version, schema_format, schema_body, lifecycle_status, created_at]
      properties:
        event_type:
          type: string
        version:
          type: integer
          minimum: 1
        schema_format:
          type: string
          enum: [JSON_SCHEMA, AVRO, PROTOBUF]
        schema_body:
          type: object
          description: Schema 定義本體；建立後不可變。
          additionalProperties: true
        compatibility_result:
          type: [string, 'null']
          enum: [COMPATIBLE, INCOMPATIBLE, null]
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatus'
        lock_version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    CreateEventSchemaVersionRequest:
      type: object
      required: [version, schema_format, schema_body]
      properties:
        version:
          type: integer
          minimum: 1
        schema_format:
          type: string
          enum: [JSON_SCHEMA, AVRO, PROTOBUF]
        schema_body:
          type: object
          additionalProperties: true
        run_compatibility_check:
          type: boolean
          default: true
    TopicRegistration:
