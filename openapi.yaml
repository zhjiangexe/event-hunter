          $ref: '#/components/responses/RateLimited'

  /api/v1/investigations:
    x-mvp-status: mvp
    x-owner: event-hunter
    get:
      tags: [Investigation]
      operationId: listInvestigations
      summary: 列出調查案件
      description: 依案件編號／標題關鍵字、狀態、嚴重度、priority、owner、tag 或 correlationId 查詢 PostgreSQL 控制面案件。
      parameters:
        - name: query
          in: query
          description: 案件編號或標題的大小寫不敏感子字串搜尋，最多 100 字元。
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvestigationStatus'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: assignee
          in: query
          description: v1.1 的 owner 欄位；保留 assignee 名稱以相容既有契約。
          schema:
            type: string
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/CasePriority'
        - name: tag
          in: query
          schema:
            type: string
        - name: correlation_id
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          description: 後端 keyset 排序欄位；cursor 會綁定此值，不能跨排序重用。
          schema:
            type: string
            enum: [created_at, updated_at]
            default: created_at
        - name: sort_order
          in: query
          description: 後端穩定排序方向；相同時間以案件 UUID 同方向排序。
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/PageSize'
        - name: cursor
          in: query
          description: 上一頁回應的 `next_cursor`，第一次查詢不傳。
          schema:
            type: string
      responses:
        '200':
          description: 案件清單。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPage'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Investigation]
      operationId: createInvestigation
      summary: 建立調查案件
      description: 建立案件。Temporal Case Workflow 是預設關閉的選項；案件建立本身不會執行 Replay。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestigationRequest'
      responses:
        '201':
          description: 案件建立成功。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 要求啟動 Temporal，但伺服器未啟用此選用能力。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/investigations/{investigationId}:
    x-mvp-status: mvp
    x-owner: event-hunter
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    get:
      tags: [Investigation]
      operationId: getInvestigation
      summary: 取得調查案件
      description: 取得案件狀態、Pattern findings、證據索引與 Temporal Workflow 關聯。
      responses:
        '200':
