    get:
      tags: [Investigation]
      operationId: getInvestigationSummary
      summary: 取得案件整合摘要
      description: 組合 PostgreSQL 案件資料、ClickHouse 業務時間線、Pattern finding 與技術觀測參照；非必要來源失敗時明確標記 partial。
      parameters:
        - $ref: '#/components/parameters/FromTimeOptional'
        - $ref: '#/components/parameters/ToTimeOptional'
        - name: include_technical
          in: query
          schema:
            type: boolean
            default: true
        - name: include_payload
          in: query
          description: 只有具 `payload:read_sensitive` 權限的 ADMIN 可設為 true；回應仍套用遞迴遮罩政策。
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Summary 內 Timeline 的最大事件數。
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
      responses:
        '200':
          description: 案件整合摘要。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
