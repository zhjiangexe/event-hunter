          format: date-time
        to:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        totals:
          $ref: '#/components/schemas/QualityTotals'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicQuality'
    QualityTotals:
      type: object
