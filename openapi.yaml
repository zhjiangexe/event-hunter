      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvestigationRequest'
      responses:
        '200':
          description: 更新成功。
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationCase'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/investigations/{investigationId}/notes:
    x-mvp-status: phase-1.1
    x-owner: event-hunter
    parameters:
      - $ref: '#/components/parameters/InvestigationId'
    post:
      tags: [Investigation]
      operationId: addInvestigationNote
      summary: 追加案件協作筆記
      description: 筆記只能新增，不能覆寫或刪除；追加與案件 lock_version 遞增在同一個 PostgreSQL transaction 內完成。
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInvestigationNoteRequest'
