schema_version: 1
project: event-hunter
decision_date: 2026-08-20

runtimes:
  go:
    language_version: "1.26.0"
    toolchain: go1.26.7
    go_mod_directives:
      - "go 1.26.0"
      - "toolchain go1.26.7"
  node:
    version: 24.19.0
    release_line: active_lts
    forbidden_release_lines: [25]
  package_manager:
    name: pnpm
    version: 10.32.1
    package_json_manager_field: "pnpm@10.32.1"

frontend_baseline:
  react: 19.2.8
  vite_release_line: "7.3"
  typescript_strict: true

dependency_resolution:
  initial_strategy: latest_stable_compatible_on_scaffold_date
  prerelease_allowed: false
  required_lockfiles: [backend/go.sum, frontend/pnpm-lock.yaml]
  forbidden_in_ci_and_build_scripts:
    - go_get_at_latest
    - pnpm_install_without_frozen_lockfile
    - unpinned_global_codegen_tool
  update_mechanism: renovate_or_dependabot_pull_request
  required_checks:
    - go mod verify
    - govulncheck ./...
    - pnpm audit
    - backend_and_frontend_test_suites

references:
  go_release_history: https://go.dev/doc/devel/release
  huma_repository: https://github.com/danielgtaylor/huma
  node_release_schedule: https://nodejs.org/en/about/previous-releases
  react_versions: https://react.dev/versions
  vite_releases: https://vite.dev/blog
