schema_version: 1
project: event-hunter

format: json_schema_2020_12
runtime_schema_source: contracts/events
dispatch_key: [eventType, eventVersion]
default_compatibility_policy: EXPLICIT_VERSION

rules:
  - eventType is stable and never reused for a different business fact
  - eventVersion starts at 1 and is a positive integer
  - schemas use additionalProperties false; adding removing renaming or changing a payload field requires a new eventVersion
  - existing schema files are immutable after release except for comments and non-behavioral metadata
  - producers publish only one configured version per eventType during steady state
  - consumers must explicitly list accepted eventType and eventVersion pairs
  - rollout publishes the new schema before enabling the new producer version
  - old consumer support is removed only after consumer inventory confirms no remaining dependency

ingestion_behavior:
  invalid_json:
    error_type: INVALID_JSON
    destination_topic: event-hunter.ingestion-failures.dlq
    clickhouse_table: event_ingestion_failures
  unknown_event_type:
    error_type: UNKNOWN_EVENT_TYPE
    destination_topic: event-hunter.ingestion-failures.dlq
    clickhouse_table: event_ingestion_failures
  unknown_event_version:
    error_type: UNKNOWN_EVENT_VERSION
    destination_topic: event-hunter.ingestion-failures.dlq
    clickhouse_table: event_ingestion_failures
  schema_violation:
    error_type: SCHEMA_VIOLATION
    destination_topic: event-hunter.ingestion-failures.dlq
    clickhouse_table: event_ingestion_failures

dlq_policy:
  retention: P7D
  classification: RESTRICTED
  automatic_replay: false
  production_redrive: forbidden
  clickhouse_stores_raw_payload: false
  clickhouse_stores_payload_sha256: true
