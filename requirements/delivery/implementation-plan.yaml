      - ADR-006 immutable Snapshot generalized Check Finding and legacy Pattern Finding migration decision
      - ADR-007 deferred Evidence Archive architecture using a PostgreSQL catalog DuckDB query-export layer and immutable encrypted Parquet objects
      - logical domain and relational model for evaluations snapshots event references relationship provenance findings feedback and Investigation links
      - stateless evaluate explicit save and Investigation handoff API resource and sequence design
      - evaluation-hash consistency idempotency concurrency retention and late-arrival decisions
      - minimum RBAC masking audit and arbitrary-SQL prohibition baseline
    completed_progress:
      - ADR-005 adopted the passive Event Check Check Model and explainable bounded scope architecture
      - ADR-006 adopted immutable Snapshot generalized Check Finding evaluation-hash consistency and legacy migration decisions
      - ADR-007 adopted the optional PostgreSQL catalog DuckDB adapter and immutable encrypted Parquet Evidence Archive boundary
      - requirements/architecture/event-check-target-design.md specifies component ownership HTTP resources sequences errors source health logical tables RBAC cutover and rollback
      - requirements/architecture/data-model.md distinguishes current runtime tables from the adopted target tables
      - no OpenAPI migration backend or frontend runtime was changed by this design-only task
    acceptance:
      - ADRs state alternatives consequences compatibility and rollback boundaries without duplicating the product requirements
      - the logical model distinguishes ephemeral evaluation durable Snapshot append-only Finding mutable feedback and Case linkage
      - saving a changed evaluation is specified as 409 EVALUATION_CHANGED instead of silently persisting a result different from the UI
