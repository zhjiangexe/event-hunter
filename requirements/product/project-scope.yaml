non_functional_requirements:
  event_volume_per_day: 1000000
  clickhouse_retention_days: 90
  event_check_default_window: PT72H
  event_check_max_window: P7D
  event_check_default_limit: 1000
  event_check_max_limit: 10000
  event_check_p95_ms: 2000
  investigation_summary_p95_ms: 5000
  concurrent_investigators: 20

local_development:
