schema_version: 1
project: event-hunter
document_control:
  document_id: EH-DOC-PROD-001
  status: active
  owner: product
  last_reviewed: 2026-08-29
  source_of_truth: true
  canonical_topic: product-scope
  supersedes: []
decision_status: accepted
decision_date: 2026-08-20
phase: mvp

sources_of_truth:
  scope: requirements/product/project-scope.yaml
  http_api: openapi.yaml
  event_api: contracts/asyncapi.yaml
  event_schemas: contracts/events
  pattern_contracts: contracts/patterns
  journey_profile_contracts: contracts/journeys
  platform_contracts: contracts/platform
  quality_contracts: contracts/quality
  integration_contracts: contracts/integrations
  telemetry_contracts: contracts/telemetry
