    - immutable_check_snapshot_and_saved_results
    - check_model_registry_with_lazy_source_yaml
    - investigation_list_cursor_pagination
    - investigation_detail_summary_timeline_snapshots_and_evidence
    - safe_ingestion_issue_search
    - grafana_explore_dashboard_and_alerting_deep_links
    - tempo_trace_and_loki_log_deep_links
    - trusted_external_origin_allowlist
  compatibility_routes: [/timeline, /journey, /journey-profiles, /patterns, /saved-searches]
  prototype_parity_non_blocking: []
