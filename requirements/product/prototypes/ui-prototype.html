        if (name === "schema") modal("PaymentCompleted · Schema v3", `<div class="eh-chip-row"><span class="eh-chip">Producer: payment-service</span><span class="eh-chip">Compatibility: BACKWARD</span><span class="eh-chip">Owner: payments-platform</span></div><pre style="margin:16px 0 0;padding:13px;border:1px solid var(--eh-border);border-radius:8px;background:var(--eh-subtle);overflow:auto;color:var(--eh-ink);font:11px/1.6 'SFMono-Regular',monospace">{\n  "eventId": "string",\n  "correlationId": "string",\n  "aggregateId": "string",\n  "occurredAt": "date-time",\n  "amount": "number"\n}</pre>`, `<button type="button" class="eh-btn" data-close-modal>關閉</button>`);
        if (name === "topic") modal("payment.events · Topic details", `<div class="eh-list"><div class="eh-list-row"><div class="eh-list-main"><div class="eh-list-title">Partition key</div><div class="eh-list-meta eh-mono">aggregateId</div></div></div><div class="eh-list-row"><div class="eh-list-main"><div class="eh-list-title">Ordering guarantee</div><div class="eh-list-meta">PER_AGGREGATE</div></div></div><div class="eh-list-row"><div class="eh-list-main"><div class="eh-list-title">Retention／PII</div><div class="eh-list-meta">30 days · CONFIDENTIAL</div></div></div></div>`, `<button type="button" class="eh-btn" data-close-modal>關閉</button>`);
        if (name === "evidence") modal("Evidence Bundle · 3 references", `<div class="eh-callout">${icon("file-check-2")}<p>摘要與 Pattern 結果只保存 reference、query template 與 checksum；完整 payload 仍留在 ClickHouse，Trace／Log／Metrics 由 Grafana 連接的觀測後端提供。</p></div><div class="eh-list" style="margin-top:15px"><div class="eh-list-row"><div><strong class="eh-mono">evt-payment-001</strong><div class="eh-list-meta">EVENT · ClickHouse · checksum sha256:8ae…</div></div><button type="button" class="eh-btn" data-toast="已開啟 ClickHouse 受控查詢">開啟</button></div><div class="eh-list-row"><div><strong class="eh-mono">trace-500</strong><div class="eh-list-meta">TRACE · Grafana → Tempo · checksum sha256:71c…</div></div><button type="button" class="eh-btn" data-toast="已開啟 Grafana／Tempo deep link">開啟</button></div><div class="eh-list-row"><div><strong class="eh-mono">finding-001</strong><div class="eh-list-meta">PATTERN_FINDING · Pattern Engine</div></div><button type="button" class="eh-btn" data-toast="Finding reference 已複製">複製</button></div></div>`, `<button type="button" class="eh-btn" data-close-modal>關閉</button>`, true);
      }

      root.addEventListener("click", event => {
        const roleButton = event.target.closest("[data-demo-role]");
        const roleSwitch = event.target.closest("[data-role-switch]");
        const pageButton = event.target.closest("[data-page]");
        const viewCase = event.target.closest("[data-view-case]");
        const tab = event.target.closest("[data-tab]");
        const open = event.target.closest("[data-modal]");
        const close = event.target.closest("[data-close-modal]");
        const confirm = event.target.closest("[data-confirm]");
        const notice = event.target.closest("[data-toast]");
        const toggleAdvanced = event.target.closest("[data-toggle-advanced]");
        if (roleButton) {
          state.role = roleButton.dataset.demoRole;
          state.page = "timeline";
          currentRole.textContent = state.role;
          login.hidden = true;
          appShell.hidden = false;
          renderPage();
          return;
        }
        if (roleSwitch) {
          state.role = null;
          appShell.hidden = true;
          login.hidden = false;
          return;
        }
        if (toggleAdvanced) {
          const advanced = document.getElementById(toggleAdvanced.getAttribute("aria-controls"));
          if (advanced) {
            advanced.hidden = !advanced.hidden;
            toggleAdvanced.setAttribute("aria-expanded", String(!advanced.hidden));
          }
          return;
        }
        if (pageButton) { state.page = pageButton.dataset.page; state.tab = "summary"; renderPage(); return; }
        if (viewCase) { state.page = "detail"; state.activeCase = viewCase.dataset.viewCase; state.tab = "summary"; renderPage(); return; }
        if (tab) { state.tab = tab.dataset.tab; renderPage(); return; }
        if (open) { openModal(open.dataset.modal); decorateModal(open.dataset.modal); return; }
        if (confirm) { modalRoot.innerHTML = ""; toast(confirm.dataset.confirm.includes("Temporal") ? "Pattern 分析已同步完成" : confirm.dataset.confirm); return; }
        if (close && (event.target === close || event.target.closest(".eh-close") || event.target.closest(".eh-modal-foot"))) { modalRoot.innerHTML = ""; return; }
        if (notice) { toast(notice.dataset.toast); return; }
      });
      root.addEventListener("submit", event => {
        if (event.target.id !== "eh-new-case-form") return;
        event.preventDefault();
        modalRoot.innerHTML = "";
        toast("案件已建立；Temporal 預設未啟用");
        state.page = "investigations";
        renderPage();
      });
      renderPage();
    })();
  </script>
</div>
