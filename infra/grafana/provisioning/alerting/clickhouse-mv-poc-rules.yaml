apiVersion: 1
groups:
  - orgId: 1
    name: event-hunter-clickhouse-mv-poc
    folder: Event Hunter
    interval: 1m
    rules:
      - uid: event-hunter-poc-admission-quarantine
        title: Event Hunter POC admission quarantine detected
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: clickhouse
            model:
              datasource: { type: grafana-clickhouse-datasource, uid: clickhouse }
              editorType: sql
              format: 1
              pluginVersion: 4.20.0
              queryType: table
              rawSql: SELECT toFloat64(count()) AS value FROM event_hunter.poc_event_admission_failures WHERE failed_at >= now() - INTERVAL 5 MINUTE
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Minimum admission contract quarantined one or more POC events
        labels:
          event_hunter_scope: poc_admission
          severity: MEDIUM
