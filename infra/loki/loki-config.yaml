auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Loki 原生 OTLP ingestion 會把部分 OpenTelemetry attributes 保存為 structured metadata。
  allow_structured_metadata: true
  # Phase 1.1 single-host baseline keeps operational logs for seven days. A
  # target environment may lengthen this only after storage and PII review.
  retention_period: 168h

# Fixture telemetry 使用固定的歷史時間；loader 會以 correlation-specific instance
# 隔離 stream。縮短 idle flush 讓歷史 deep link 不必等待預設的長時間 chunk flush，
# 同時保留足以涵蓋單一物流情境的 out-of-order 視窗。
ingester:
  chunk_idle_period: 5s
  max_chunk_age: 2h
  wal:
    enabled: true
    dir: /loki/wal
    # The Phase 1 persistence gate restarts Loki immediately after a live
    # service chain. Flush active chunks on SIGTERM while retaining the WAL as
    # crash recovery, so recently accepted canonical logs survive the restart.
    flush_on_shutdown: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
