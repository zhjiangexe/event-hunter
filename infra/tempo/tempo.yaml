server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    # Demo fixtures span several days so their trusted deep links remain
    # inspectable after a workstation restart.
    block_retention: 168h

usage_report:
  reporting_enabled: false
